<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>cheas testing frontend</title>
        <style>
            html {
                color-scheme: light dark;
            }
        </style>
    </head>
    <body>
        <button id="mic-input">mic input</button>
        <script>
            const micInputStart = document.getElementById("mic-input")

            micInputStart.onclick = () => {
                navigator.mediaDevices
                    .getUserMedia({
                        audio: true,
                        video: false,
                    })
                    .then(async (stream) => {
                        const audioCtx = new AudioContext()
                        await audioCtx.audioWorklet.addModule(
                            "record-worklet.js",
                        )
                        const merger = audioCtx.createChannelMerger(1)
                        const recordNode = new AudioWorkletNode(
                            audioCtx,
                            "record",
                        )
                        let sampleRate = 0
                        let nextAudioStart = 0
                        recordNode.port.onmessage = (e) => {
                            console.log(e.data)
                            if (typeof e.data == "number") {
                                sampleRate = e.data
                                return
                            }
                            const bufferSource = audioCtx.createBufferSource()
                            bufferSource.connect(audioCtx.destination)
                            const audioBuffer = audioCtx.createBuffer(
                                1,
                                e.data.length,
                                sampleRate,
                            )
                            const channelData = audioBuffer.getChannelData(0)
                            for (let i = 0; i < e.data.length; i++) {
                                channelData[i] = e.data[i]
                            }
                            bufferSource.buffer = audioBuffer
                            nextAudioStart = Math.max(
                                nextAudioStart,
                                audioCtx.currentTime,
                            )
                            bufferSource.start(nextAudioStart)
                            nextAudioStart += e.data.length / sampleRate
                        }
                        recordNode.connect(audioCtx.destination)
                        audioCtx
                            .createMediaStreamSource(stream)
                            .connect(merger)
                            .connect(recordNode)
                    })
            }
        </script>
    </body>
</html>
